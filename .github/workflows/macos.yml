name: macOS preview
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and output tests
        run: bash macos/scripts/test-core.sh
      - name: Build universal application
        run: bash macos/scripts/build-app.sh --universal
      - name: Upload preview archive
        uses: actions/upload-artifact@v4
        with:
          name: PRO2-Mac-preview
          path: |
            macos/dist/PRO2-Mac-0.1.0.zip
            macos/dist/pro2-diagnostics
